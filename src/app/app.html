<app-header />

<main>
  <!-- Places the user list and selected user tasks side by side -->
  <div class="user-layout">

    <!-- Contains all user components -->
    <div class="users">

      <!-- Creates one user component for each user -->
      @for (user of users; track user.id) {
        <!-- Sends the user object and receives the selected user ID -->
        <app-user
          [user]="user"
          (select)="onSelectUser($event)"
        />
      }

    </div>

    <!-- Shows tasks only when a user is selected -->
    @if (selectedUser; as user) {
      <!-- Sends the selected user ID and name to the tasks component -->
      <app-tasks
        [userId]="user.id"
        [name]="user.name"
      />
    } @else {
      <!-- Shows a message before a user is selected -->
      <p class="fallback">Please select a user.</p>
    }

  </div>
</main>
