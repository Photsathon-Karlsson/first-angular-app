<app-header />

<main>
  <!-- Groups the user and active user components -->
  <div class="user-layout">

    <!-- Sends the user object and receives the selected user ID -->
    <app-user
      [user]="selectedUser()"
      (select)="onSelectUser($event)"
    />

    <!-- Sends the selected user name to the active user component -->
    <app-active-user
      [name]="selectedUser().name"
    />

  </div>
</main>
