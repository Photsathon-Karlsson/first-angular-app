<!-- For displaying the new task form and handling form submission -->

<!-- Closes the dialog when the background is clicked -->
<div
  class="backdrop"
  (click)="onCancel()"
></div>

<!-- Contains the new task form -->
<dialog open>

  <!-- Displays the dialog title -->
  <h2>Add Task</h2>

  <!-- Submits the entered task data -->
  <form (ngSubmit)="onSubmit()">

    <!-- Contains the task title input -->
    <p>
      <label for="title">Title</label>
      <input
        type="text"
        id="title"
        name="title"
        [(ngModel)]="enteredTitle"
      />
    </p>

    <!-- Contains the task summary input -->
    <p>
      <label for="summary">Summary</label>
      <textarea
        id="summary"
        name="summary"
        rows="5"
        [(ngModel)]="enteredSummary"
      ></textarea>
    </p>

    <!-- Contains the task due date input -->
    <p>
      <label for="due-date">Due Date</label>
      <input
        type="date"
        id="due-date"
        name="due-date"
        [(ngModel)]="enteredDate"
      />
    </p>

    <!-- Contains the dialog action buttons -->
    <p class="actions">

      <!-- Closes the new task dialog -->
      <button
        type="button"
        (click)="onCancel()"
      >
        Cancel
      </button>

      <!-- Submits the new task form -->
      <button type="submit">
        Create
      </button>

    </p>

  </form>

</dialog>
