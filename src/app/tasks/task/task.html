<!-- Displays one task -->
<article>
  <!-- Shows the task title -->
  <h2>{{ task().title }}</h2>

  <!-- Shows the task due date -->
  <time>{{ task().dueDate }}</time>

  <!-- Shows the task summary -->
  <p>{{ task().summary }}</p>

  <!-- Contains the task action button -->
  <p class="actions">
    <button>Complete</button>
  </p>
</article>
