<!-- Displays one task and formats the due date -->
<article>
  <!-- Shows the task title -->
  <h2>{{ task().title }}</h2>

  <!-- Shows the formatted task due date -->
  <time>{{ task().dueDate | date }}</time>

  <!-- Shows the task summary -->
  <p>{{ task().summary }}</p>

  <!-- Contains the task action button -->
  <p class="actions">
    <!-- Sends the task ID when the button is clicked -->
    <button (click)="onCompleteTask()">Complete</button>
  </p>
</article>
