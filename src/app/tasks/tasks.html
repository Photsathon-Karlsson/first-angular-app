<!-- Displays and manages the selected user's tasks -->
<section id="tasks">

  <!-- Displays the task section header -->
  <header>
    <!-- Shows the selected user's name -->
    <h2>{{ name() }}'s Tasks</h2>

    <!-- Contains the add task button -->
    <menu>
      <button>Add Task</button>
    </menu>
  </header>

  <!-- Contains the task list -->
  <ul>
    <!-- Creates one task component for each selected user task -->
    @for (task of selectedUserTasks; track task.id) {
      <li>
        <!-- Sends the task data and receives the completed task ID -->
        <app-task
          [task]="task"
          (complete)="onCompleteTask($event)"
        />
      </li>
    }
  </ul>

</section>
