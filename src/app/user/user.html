<!-- Contains the user button -->
<div>
  <!-- Calls onSelectUser() when the button is clicked -->
  <button (click)="onSelectUser()">

    <!-- Shows the user's image -->
    <img
      [src]="imagePath"
      [alt]="user().name"
    />

    <!-- Shows the user's name -->
    <span>{{ user().name }}</span>

  </button>
</div>
