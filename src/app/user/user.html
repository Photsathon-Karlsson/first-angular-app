<!-- Displays one user button inside a reusable card -->
<app-card>

  <!-- Calls onSelectUser() and adds the selected class when active -->
  <button
    [class.selected]="selected()"
    (click)="onSelectUser()"
  >

    <!-- Shows the user's image -->
    <img
      [src]="imagePath"
      [alt]="user().name"
    />

    <!-- Shows the user's name -->
    <span>{{ user().name }}</span>

  </button>

</app-card>
